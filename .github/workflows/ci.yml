name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  appraisals:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - id: list
        name: List appraisals defined in Appraisals
        run: echo "matrix=$(bundle exec appraisal list | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  test:
    needs: appraisals
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        appraisal: ${{ fromJson(needs.appraisals.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install this appraisal's gemfile
        # Scoped to just this matrix cell's gemfile. `appraisal generate-install`
        # would instead install every gemfile in Appraisals into this one job's
        # shared vendor/bundle, and when two appraisals depend on the identical
        # version of a gem with a native extension (e.g. both json-3 appraisals on
        # json 3.0.x), installing it twice into the same vendor/bundle collides
        # mid-build ("Directory not empty @ rb_file_s_rename", or a missing
        # extconf.rb on the second attempt) and fails the whole job.
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle install --retry 3

      - name: Run generator specs
        run: bundle exec appraisal ${{ matrix.appraisal }} rake spec:generators

      - name: Prepare dummy app
        run: bundle exec appraisal ${{ matrix.appraisal }} rake dummy:prepare

      - name: Run request specs
        run: bundle exec appraisal ${{ matrix.appraisal }} rake spec:requests
